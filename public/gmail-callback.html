<!DOCTYPE html>
<html>
<head><title>Conectando Gmail...</title></head>
<body>
<script>
  // ✅ FIX: antes esto guardaba el código en localStorage y AL TIRO
  // navegaba a "/" — en iOS Safari esa escritura puede perder la carrera
  // contra la navegación (el código nunca llegaba a guardarse de verdad) y
  // la conexión fallaba en silencio, sin ningún aviso. Ahora el código va
  // directo en la URL de vuelta, que no tiene ese problema de carrera.
  const hash = window.location.hash.substring(1)
  const params = new URLSearchParams(hash)
  const token = params.get('access_token')
  if (token) {
    window.location.href = '/?gmail_connected=1&legacy_token=' + encodeURIComponent(token)
  } else {
    const search = new URLSearchParams(window.location.search)
    const code = search.get('code')
    if (code) {
      window.location.href = '/?gmail_connected=1&code=' + encodeURIComponent(code)
    } else {
      window.location.href = '/?gmail_error=1'
    }
  }
</script>
<p>Conectando con Gmail...</p>
</body>
</html>
